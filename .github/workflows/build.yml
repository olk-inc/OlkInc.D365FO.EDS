# Shared build used by the three pipelines build-ga.yml, build-ga-1.yml and build-ga-2.yml.
#
# Picks the F&O version from Microsoft's published release schedule (build/Resolve-FnoVersions.ps1):
# offset 0 is the newest generally available version, 1 the one before it, 2 the one before that.
# Compiles the models against that version and creates the deployable packages.
# On a push to main it also publishes a GitHub release for that F&O version:
#   tag v<major>.<minor>.<build>.<commit count>-fo<F&O version>, for example v1.0.0.42-fo10.0.49.
# Setup and details: docs/build-and-release.md.
name: Build (shared)

on:
  workflow_call:
    inputs:
      ga-offset:
        description: 0 = newest GA version, 1 = the one before, 2 = the one before that
        type: number
        required: true

jobs:
  build:
    name: build
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      fno: ${{ steps.fno.outputs.fno }}
      version: ${{ steps.version.outputs.version }}
    env:
      NUGET_PATH: ${{ github.workspace }}\out\nuget
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit count is the model version's revision.
          fetch-depth: 0
          # The build runs a third-party PowerShell module; keep the repository token out of reach.
          persist-credentials: false

      - name: F&O version
        id: fno
        shell: pwsh
        run: ./build/Resolve-FnoVersions.ps1 -Offset ${{ inputs.ga-offset }}

      # Same number in all three pipelines for the same commit.
      - name: Model version
        id: version
        shell: pwsh
        run: |
          [xml] $d = Get-Content -Raw 'Metadata/OlkInc-D365FO-EDS/Descriptor/OlkInc-D365FO-EDS.xml'
          $m = $d.AxModelInfo
          $revision = (git rev-list --count HEAD).Trim()
          $version = "$($m.VersionMajor).$($m.VersionMinor).$($m.VersionBuild).$revision"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Model version $version"

      # The Microsoft packages are several GB; download them once per F&O version.
      - name: Cache X++ build packages
        uses: actions/cache@v4
        with:
          path: out/nuget
          key: d365-nuget-${{ steps.fno.outputs.fno }}

      - uses: microsoft/setup-msbuild@v2

      - name: Build models and deployable packages
        shell: pwsh
        env:
          # Only used if the community storage does not have this version.
          D365_NUGET_FEED_URL: ${{ secrets.D365_NUGET_FEED_URL }}
          D365_NUGET_FEED_USER: ${{ secrets.D365_NUGET_FEED_USER }}
          D365_NUGET_FEED_TOKEN: ${{ secrets.D365_NUGET_FEED_TOKEN }}
        run: >
          ./build/Build-EDS.ps1
          -Version '${{ steps.version.outputs.version }}'
          -FnoVersion '${{ steps.fno.outputs.fno }}'
          -VersionStrategy GA
          -PackageSuffix '-FO${{ steps.fno.outputs.fno }}'
          -NuGetPath $env:NUGET_PATH

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-FO${{ steps.fno.outputs.fno }}
          path: out/release/*.zip
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-FO${{ needs.build.outputs.fno }}
          path: out/release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ needs.build.outputs.version }}'
          $fno = '${{ needs.build.outputs.fno }}'
          $repo = '${{ github.repository }}'
          $tag = "v$v-fo$fno"
          $assets = @(Get-ChildItem out/release/*.zip | Sort-Object Name | ForEach-Object FullName)
          $notes = @(
            "Model version $v built against Dynamics 365 finance and operations $fno (generally available), from commit ${{ github.sha }}.",
            '',
            "| File | Install on |",
            "| --- | --- |",
            "| ``OlkInc-D365FO-EDS-$v-FO$fno.zip`` | Any environment on $fno or later, including production |",
            "| ``OlkInc-D365FO-EDS-Test-$v-FO$fno.zip`` | Development and test environments on $fno or later (model and tests) |",
            '',
            'The same model version is also released for the other current GA versions. Pick the release for the oldest F&O version among the environments you install on.',
            '',
            'Installation: see docs/build-and-release.md in the repository.'
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notesFile $notes
          # Only the release for the newest GA version is marked as the repository's latest release.
          $latest = if (${{ inputs.ga-offset }} -eq 0) { '--latest' } else { '--latest=false' }
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $repo
          } else {
            gh release create $tag @assets --repo $repo --target '${{ github.sha }}' --title "OlkInc-D365FO-EDS $v for F&O $fno" --notes-file $notesFile $latest
          }
          if ($LASTEXITCODE) { throw "Publishing the release failed ($LASTEXITCODE)." }
